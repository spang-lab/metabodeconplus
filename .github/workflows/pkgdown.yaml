# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: PkgDown
on: {
  push: {branches: [main, master]},
  pull_request: {branches: [main, master]},
  release: {types: [published]},
  workflow_dispatch: {}
}
jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true, extra-repositories: "https://spang-lab.r-universe.dev" }

      - name: Install MacOS System Dependencies
        uses: r-hub/actions/setup-r-sysreqs@v1
        with: {type: "minimal"}

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libgsl0-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with: { extra-packages: "any::pkgdown, local::.", needs: website }

      # speaq is a Suggests used only by align(use_speaq = TRUE); it is not
      # needed to build the docs. It pulls Rfast, whose RSPM binary currently
      # has a broken oneTBB ABI on the runner (undefined symbol
      # _ZTIN3tbb4taskE), which crashes pkgdown when downlit loads speaq to
      # resolve speaq:: links. Removing speaq makes downlit skip those links
      # gracefully; no Rfast is loaded.
      - name: Remove speaq to avoid its broken Rfast binary
        run: try(remove.packages("speaq"), silent = TRUE)
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with: { clean: false, branch: gh-pages, folder: docs }
